name: test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: ratchet
        if: github.event_name == 'pull_request'
        run: python3 -I scripts/ci_ratchet.py --base origin/${{ github.base_ref }}
      - run: uv run pytest -q
