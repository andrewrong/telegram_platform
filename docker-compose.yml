version: '3.8'

services:
  telegram-bot:
    # crew sets CREW_IMAGE (<service>:<short sha>) on deploy; a local build keeps the old tag.
    image: ${CREW_IMAGE:-telegram-asr-bot:latest}
    build:
      context: .
      target: production
    container_name: telegram-asr-bot
    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'          # Max 1 CPU core
          memory: 256M         # Max 256MB RAM
        reservations:
          cpus: '0.25'         # Reserve 0.25 CPU
          memory: 128M         # Reserve 128MB RAM

    # Environment
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ASR_SERVICE_URL=${ASR_SERVICE_URL_DOCKER:-http://host.docker.internal:28113}
      - OCR_SERVICE_URL=${OCR_SERVICE_URL_DOCKER:-http://host.docker.internal:18100}

    # The .env lives in the service directory (crew sets CREW_SERVICE_DIR); never in Git.
    env_file:
      - ${CREW_SERVICE_DIR:-.}/.env

    # Mount logs and the durable update inbox for persistence
    volumes:
      - ${CREW_SERVICE_DIR:-.}/logs:/app/logs
      - ${CREW_SERVICE_DIR:-.}/data:/app/data

    # Network configuration
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Health endpoint, reachable from the host loopback only
    ports:
      - "127.0.0.1:28120:28120"

    # Network (isolated)
    networks:
      - bot-network

    # Health check
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:28120/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  bot-network:
    driver: bridge
